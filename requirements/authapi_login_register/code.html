<script>
  // Initialize form container height
  const wrapper = document.getElementById('form-wrapper');
  const signinForm = document.getElementById('form-signin');
  const signupForm = document.getElementById('form-signup');
  
  // Set initial height
  setTimeout(() => {
    wrapper.style.height = `${signinForm.offsetHeight}px`;
  }, 50);

  function switchTab(tab) {
    const indicator = document.getElementById('tab-indicator');
    const btnSignin = document.getElementById('btn-signin');
    const btnSignup = document.getElementById('btn-signup');

    if (tab === 'signin') {
      indicator.style.transform = 'translateX(0)';
      
      btnSignin.classList.replace('text-on-surface-variant', 'text-on-surface');
      btnSignup.classList.replace('text-on-surface', 'text-on-surface-variant');

      signinForm.style.transform = 'translateX(0)';
      signinForm.style.opacity = '1';
      signinForm.style.pointerEvents = 'auto';

      signupForm.style.transform = 'translateX(110%)';
      signupForm.style.opacity = '0';
      signupForm.style.pointerEvents = 'none';

      wrapper.style.height = `${signinForm.offsetHeight}px`;
      
      document.querySelector('h1').innerText = 'Welcome Back';
      document.querySelector('p').innerText = 'Authenticate to access your workspace';
    } else {
      indicator.style.transform = 'translateX(100%)';
      
      btnSignup.classList.replace('text-on-surface-variant', 'text-on-surface');
      btnSignin.classList.replace('text-on-surface', 'text-on-surface-variant');

      signupForm.style.transform = 'translateX(0)';
      signupForm.style.opacity = '1';
      signupForm.style.pointerEvents = 'auto';

      signinForm.style.transform = 'translateX(-110%)';
      signinForm.style.opacity = '0';
      signinForm.style.pointerEvents = 'none';

      wrapper.style.height = `${signupForm.offsetHeight}px`;
      
      document.querySelector('h1').innerText = 'Create Account';
      document.querySelector('p').innerText = 'Join us to configure your environment';
    }
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('span');
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      icon.innerText = 'visibility';
    }
  }

  function handleAuth(e, type) {
    e.preventDefault();
    
    const btnText = document.getElementById(`${type}-btn-text`);
    const loading = document.getElementById(`${type}-loading`);
    
    btnText.style.opacity = '0';
    loading.style.opacity = '1';
    loading.classList.remove('pointer-events-none');

    // Simulate API call
    setTimeout(() => {
      btnText.style.opacity = '1';
      loading.style.opacity = '0';
      loading.classList.add('pointer-events-none');
      
      // Success feedback (simple shake or color change could go here)
    }, 1500);
  }

  function checkStrength(val) {
    const bars = [
      document.getElementById('strength-1'),
      document.getElementById('strength-2'),
      document.getElementById('strength-3'),
      document.getElementById('strength-4')
    ];
    
    let strength = 0;
    if (val.length > 5) strength += 1;
    if (val.length > 8) strength += 1;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength += 1;
    if (/[0-9!@#$%^&*]/.test(val)) strength += 1;

    bars.forEach((bar, index) => {
      bar.className = 'h-full flex-1 transition-colors duration-300'; // reset
      if (index < strength) {
        if (strength === 1) bar.classList.add('bg-error');
        else if (strength === 2) bar.classList.add('bg-tertiary');
        else if (strength >= 3) bar.classList.add('bg-[#10b981]'); // Emerald for strong
      }
    });
  }
</script></main>
